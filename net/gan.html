<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肝小叶血液与胆汁双向流动 - 3D可视化</title>
    <style>
        :root {
            --bg: #1a1d23;
            --panel-bg: #21252b;
            --text: #d4d4d4;
            --text-light: #aab;
            --accent-red: #e0556a;
            --accent-blue: #5a9fd4;
            --accent-yellow: #e5c07b;
            --accent-purple: #9b6dcd;
            --accent-green: #6cb878;
            --border: #333842;
            --hover: #2c313a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 10px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }
        #header h1 {
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #e8e8e8;
            white-space: nowrap;
        }
        #header .badge {
            font-size: 0.7em;
            background: var(--accent-purple);
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        #main-container {
            flex: 1;
            position: relative;
            display: flex;
            min-height: 0;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            cursor: grab;
            min-width: 0;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        #canvas-container.grabbing {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        /* 浮动信息提示 */
        #tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(20, 22, 28, 0.94);
            color: #f0f0f0;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85em;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 20;
            max-width: 260px;
            text-align: center;
            transition: opacity 0.15s;
        }
        #tooltip .tt-name {
            font-weight: 700;
            font-size: 0.95em;
            margin-bottom: 2px;
        }
        #tooltip .tt-desc {
            font-size: 0.78em;
            color: #bbb;
        }

        /* 图例浮动卡片 */
        #legend-float {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(28, 31, 38, 0.9);
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            z-index: 15;
            font-size: 0.78em;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            backdrop-filter: blur(6px);
        }
        #legend-float .leg-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #legend-float .leg-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }
        .leg-dot.blood {
            background: #f06272;
            box-shadow: 0 0 8px #f06272;
        }
        .leg-dot.bile {
            background: #e8b84b;
            box-shadow: 0 0 8px #e8b84b;
        }
        .leg-dot.artery {
            background: #e0556a;
        }
        .leg-dot.vein {
            background: #5a9fd4;
        }
        .leg-dot.duct {
            background: #7cc97c;
        }
        .leg-dot.cv {
            background: #9b6dcd;
        }

        /* 底部控制栏 */
        #control-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 31, 38, 0.92);
            border-radius: 28px;
            padding: 10px 20px;
            border: 1px solid var(--border);
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        #control-bar label {
            font-size: 0.78em;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            white-space: nowrap;
        }
        #control-bar input[type="checkbox"] {
            accent-color: var(--accent-red);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        #control-bar input[type="checkbox"].bile-check {
            accent-color: var(--accent-yellow);
        }
        #control-bar input[type="range"] {
            width: 80px;
            accent-color: #888;
            cursor: pointer;
        }
        #control-bar button {
            background: var(--hover);
            border: 1px solid var(--border);
            color: #ddd;
            padding: 7px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.78em;
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        #control-bar button:hover {
            background: #3a3f4a;
            border-color: #667;
            color: #fff;
        }
        #control-bar button.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }
        .speed-val {
            font-size: 0.75em;
            color: #aaa;
            min-width: 36px;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            #header h1 {
                font-size: 1em;
            }
            #legend-float {
                top: 8px;
                right: 6px;
                padding: 8px 10px;
                font-size: 0.68em;
                gap: 4px;
            }
            #control-bar {
                bottom: 8px;
                padding: 8px 12px;
                gap: 8px;
                border-radius: 20px;
            }
            #control-bar button {
                padding: 5px 10px;
                font-size: 0.7em;
            }
            #control-bar input[type="range"] {
                width: 50px;
            }
            #tooltip {
                font-size: 0.72em;
                max-width: 200px;
                padding: 6px 10px;
            }
        }
        @media (max-width: 480px) {
            #header h1 {
                font-size: 0.85em;
            }
            #legend-float {
                top: 4px;
                right: 2px;
                padding: 6px 8px;
                font-size: 0.6em;
                border-radius: 6px;
                gap: 2px;
            }
            #legend-float .leg-dot {
                width: 8px;
                height: 8px;
            }
            #control-bar {
                bottom: 4px;
                padding: 6px 8px;
                gap: 5px;
                border-radius: 16px;
                font-size: 0.65em;
            }
            #control-bar button {
                padding: 4px 8px;
                font-size: 0.65em;
            }
            #control-bar input[type="range"] {
                width: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部标题栏 -->
    <div id="header">
        <h1>🫁 肝小叶微循环 · 血液与胆汁双向流动</h1>
        <span class="badge">医学教学可视化</span>
    </div>

    <!-- 主容器 -->
    <div id="main-container">
        <div id="canvas-container">
            <!-- 浮动图例 -->
            <div id="legend-float">
                <div class="leg-row"><span class="leg-dot blood"></span> 血液粒子（向心流动）</div>
                <div class="leg-row"><span class="leg-dot bile"></span> 胆汁粒子（离心流动）</div>
                <div class="leg-row"><span class="leg-dot artery"></span> 小叶间动脉</div>
                <div class="leg-row"><span class="leg-dot vein"></span> 小叶间静脉</div>
                <div class="leg-row"><span class="leg-dot duct"></span> 小叶间胆管</div>
                <div class="leg-row"><span class="leg-dot cv"></span> 中央静脉</div>
            </div>
            <!-- 悬停提示 -->
            <div id="tooltip">
                <div class="tt-name"></div>
                <div class="tt-desc"></div>
            </div>
            <!-- 底部控制栏 -->
            <div id="control-bar">
                <label title="显示/隐藏血液粒子（红色·向心流动）">
                    <input type="checkbox" id="showBlood" checked> 血液流
                </label>
                <label title="显示/隐藏胆汁粒子（黄色·离心流动）">
                    <input type="checkbox" id="showBile" class="bile-check" checked> 胆汁流
                </label>
                <span style="color:#aaa;">|</span>
                <span style="font-size:0.75em;color:#bbb;">流速</span>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" title="调整粒子流动速度">
                <span class="speed-val" id="speedVal">1×</span>
                <span style="color:#aaa;">|</span>
                <button id="btnPause" title="暂停/播放粒子动画">⏯️ 暂停</button>
                <button id="btnReset" title="恢复默认视角">🔄 重置视角</button>
            </div>
        </div>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== DOM 元素 ====================
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        const ttName = tooltip.querySelector('.tt-name');
        const ttDesc = tooltip.querySelector('.tt-desc');
        const checkboxBlood = document.getElementById('showBlood');
        const checkboxBile = document.getElementById('showBile');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1d23');
        scene.fog = new THREE.Fog('#1a1d23', 12, 35);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.5, 50);
        camera.position.set(0, 9.5, 3.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // OrbitControls - 旋转/缩放/平移
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.6, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.12;
        controls.minDistance = 3.5;
        controls.maxDistance = 16;
        controls.maxPolarAngle = Math.PI * 0.7;
        controls.minPolarAngle = 0.15;
        controls.update();
        // 存储默认状态
        const defaultCameraPos = camera.position.clone();
        const defaultTarget = controls.target.clone();

        // ==================== 光照 ====================
        const ambientLight = new THREE.AmbientLight('#8899bb', 1.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight('#ffffff', 3.5);
        sunLight.position.set(8, 14, 4);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 40;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunLight.shadow.bias = -0.0002;
        scene.add(sunLight);
        const fillLight = new THREE.DirectionalLight('#aaccff', 0.8);
        fillLight.position.set(-3, 2, -3);
        scene.add(fillLight);

        // ==================== 材质工厂 ====================
        function createGlowMaterial(hexColor, opacity = 0.55, emissiveIntensity = 0.5) {
            return new THREE.MeshStandardMaterial({
                color: new THREE.Color(hexColor),
                roughness: 0.35,
                metalness: 0.08,
                transparent: true,
                opacity: opacity,
                emissive: new THREE.Color(hexColor),
                emissiveIntensity: emissiveIntensity,
                depthWrite: false,
            });
        }

        // ==================== 地面参考平面 ====================
        const groundGeo = new THREE.PlaneGeometry(16, 16);
        const groundMat = new THREE.MeshStandardMaterial({
            color: '#1c1f26',
            roughness: 0.9,
            metalness: 0.05,
            depthWrite: true,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -3.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==================== 六边形底板（肝小叶轮廓） ====================
        const HEX_RADIUS = 4.2; // 六边形外接圆半径
        const hexGeo = new THREE.CylinderGeometry(HEX_RADIUS, HEX_RADIUS, 0.08, 6);
        const hexMat = new THREE.MeshStandardMaterial({
            color: '#2a2d38',
            roughness: 0.5,
            metalness: 0.2,
            transparent: true,
            opacity: 0.7,
        });
        const hexPlate = new THREE.Mesh(hexGeo, hexMat);
        hexPlate.position.y = 0.02;
        hexPlate.receiveShadow = true;
        hexPlate.castShadow = true;
        hexPlate.name = '肝小叶六边形底板';
        scene.add(hexPlate);

        // 六边形边框发光环
        const hexEdgePoints = [];
        for (let i = 0; i <= 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 6;
            hexEdgePoints.push(new THREE.Vector3(HEX_RADIUS * Math.cos(angle), 0.06, HEX_RADIUS * Math.sin(angle)));
        }
        const hexEdgeGeo = new THREE.BufferGeometry().setFromPoints(hexEdgePoints);
        const hexEdgeLine = new THREE.Line(hexEdgeGeo, new THREE.LineBasicMaterial({
            color: '#556677',
            linewidth: 1,
            transparent: true,
            opacity: 0.7,
            depthTest: true,
        }));
        hexEdgeLine.name = '肝小叶边界';
        scene.add(hexEdgeLine);

        // 六边形顶点角度（6个门管区方向）
        const portalAngles = [];
        for (let i = 0; i < 6; i++) {
            portalAngles.push((Math.PI / 3) * i - Math.PI / 6);
        }

        // ==================== 中央静脉 ====================
        const cvGroup = new THREE.Group();
        cvGroup.name = '中央静脉';
        const cvGeo = new THREE.CylinderGeometry(0.45, 0.5, 3.0, 24);
        const cvMat = new THREE.MeshStandardMaterial({
            color: '#8b5fbf',
            roughness: 0.3,
            metalness: 0.4,
            emissive: '#3d1f6e',
            emissiveIntensity: 0.6,
        });
        const cvMesh = new THREE.Mesh(cvGeo, cvMat);
        cvMesh.position.y = 1.5;
        cvMesh.castShadow = true;
        cvMesh.receiveShadow = true;
        cvGroup.add(cvMesh);
        // 中央静脉顶部环
        const cvRingGeo = new THREE.TorusGeometry(0.5, 0.07, 12, 20);
        const cvRingMat = new THREE.MeshStandardMaterial({
            color: '#b380e0',
            roughness: 0.2,
            metalness: 0.5,
            emissive: '#5a2d8a',
            emissiveIntensity: 0.8,
        });
        const cvRing = new THREE.Mesh(cvRingGeo, cvRingMat);
        cvRing.rotation.x = Math.PI / 2;
        cvRing.position.y = 3.02;
        cvGroup.add(cvRing);
        // 底部环
        const cvRingBtm = new THREE.Mesh(cvRingGeo.clone(), cvRingMat.clone());
        cvRingBtm.rotation.x = Math.PI / 2;
        cvRingBtm.position.y = 0.02;
        cvGroup.add(cvRingBtm);
        scene.add(cvGroup);

        // 中央静脉检测球（用于悬停）
        const cvHitGeo = new THREE.SphereGeometry(0.7, 16, 16);
        const cvHitMat = new THREE.MeshBasicMaterial({ visible: false, depthTest: false, depthWrite: false });
        const cvHitSphere = new THREE.Mesh(cvHitGeo, cvHitMat);
        cvHitSphere.position.set(0, 1.5, 0);
        cvHitSphere.name = '中央静脉';
        cvHitSphere.userData = {
            label: '中央静脉',
            desc: '肝小叶轴心，收集肝血窦汇入的血液，\n最终汇入小叶下静脉→肝静脉→下腔静脉',
        };
        scene.add(cvHitSphere);

        // ==================== 门管区三联征 ====================
        const portalGroups = [];
        const portalHitSpheres = [];
        const portalGlowRings = [];

        portalAngles.forEach((angle, idx) => {
            const px = HEX_RADIUS * Math.cos(angle);
            const pz = HEX_RADIUS * Math.sin(angle);
            const portalCenter = new THREE.Vector3(px, 0, pz);

            const group = new THREE.Group();
            group.name = `门管区-${idx + 1}`;
            group.position.copy(portalCenter);

            // 向心方向（指向原点）
            const inwardDir = new THREE.Vector3(-px, 0, -pz).normalize();
            // 切线方向
            const tangentDir = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize();

            // 三个小柱体偏移
            const offsets = [
                { label: '小叶间动脉', color: '#e0555a', emissive: '#6b1a1f', dx: inwardDir.x * 0.35 + tangentDir.x * 0.25,
                    dz: inwardDir.z * 0.35 + tangentDir.z * 0.25 },
                { label: '小叶间静脉', color: '#4d94d4', emissive: '#1a3d5c', dx: inwardDir.x * 0.35 - tangentDir.x * 0.25,
                    dz: inwardDir.z * 0.35 - tangentDir.z * 0.25 },
                { label: '小叶间胆管', color: '#6cb870', emissive: '#1e4022', dx: -inwardDir.x * 0.2, dz: -inwardDir.z * 0.2 },
            ];

            offsets.forEach((off) => {
                const cylGeo = new THREE.CylinderGeometry(0.16, 0.18, 1.4, 12);
                const cylMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(off.color),
                    roughness: 0.3,
                    metalness: 0.3,
                    emissive: new THREE.Color(off.emissive),
                    emissiveIntensity: 0.5,
                });
                const cyl = new THREE.Mesh(cylGeo, cylMat);
                cyl.position.set(off.dx, 0.7, off.dz);
                cyl.castShadow = true;
                cyl.receiveShadow = true;
                cyl.name = off.label;
                cyl.userData = { label: off.label, desc: getTriadDesc(off.label) };
                group.add(cyl);
            });

            // 门管区底板小六边形
            const smallHexGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.06, 6);
            const smallHexMat = new THREE.MeshStandardMaterial({
                color: '#3a3d48',
                roughness: 0.4,
                metalness: 0.3,
                transparent: true,
                opacity: 0.8,
            });
            const smallHex = new THREE.Mesh(smallHexGeo, smallHexMat);
            smallHex.position.y = 0.03;
            group.add(smallHex);

            scene.add(group);
            portalGroups.push(group);

            // 门管区脉冲光环
            const glowRingGeo = new THREE.TorusGeometry(0.5, 0.05, 10, 18);
            const glowRingMat = new THREE.MeshStandardMaterial({
                color: '#ffcc88',
                roughness: 0.2,
                metalness: 0.1,
                emissive: '#ff9930',
                emissiveIntensity: 1.2,
                transparent: true,
                opacity: 0.7,
                depthWrite: false,
            });
            const glowRing = new THREE.Mesh(glowRingGeo, glowRingMat);
            glowRing.rotation.x = Math.PI / 2;
            glowRing.position.set(px, 0.08, pz);
            glowRing.name = `门管区光环-${idx + 1}`;
            scene.add(glowRing);
            portalGlowRings.push({ mesh: glowRing, baseScale: 1.0, phase: idx * 1.1 });

            // 门管区检测球
            const hitGeo = new THREE.SphereGeometry(0.6, 12, 12);
            const hitMat = new THREE.MeshBasicMaterial({ visible: false, depthTest: false, depthWrite: false });
            const hitSphere = new THREE.Mesh(hitGeo, hitMat);
            hitSphere.position.set(px, 0.7, pz);
            hitSphere.name = `门管区-${idx + 1}`;
            hitSphere.userData = {
                label: `门管区（门管三联征）`,
                desc: '小叶间动脉(红)·小叶间静脉(蓝)·小叶间胆管(绿)\n血液由此进入肝血窦，胆汁由此流出肝小叶',
            };
            scene.add(hitSphere);
            portalHitSpheres.push(hitSphere);
        });

        function getTriadDesc(label) {
            if (label.includes('动脉')) return '肝动脉分支，供应含氧血液';
            if (label.includes('静脉')) return '门静脉分支，携带胃肠道吸收的营养物质';
            if (label.includes('胆管')) return '收集肝细胞分泌的胆汁，向肝外输送';
            return '';
        }

        // ==================== 肝细胞索放射线 ====================
        const hepatocyteLinesGroup = new THREE.Group();
        hepatocyteLinesGroup.name = '肝细胞索（放射状排列）';
        for (let i = 0; i < 36; i++) {
            const a = (Math.PI * 2 / 36) * i;
            const innerR = 0.7;
            const outerR = HEX_RADIUS - 0.3;
            const pts = [
                new THREE.Vector3(innerR * Math.cos(a), 0.07, innerR * Math.sin(a)),
                new THREE.Vector3(outerR * Math.cos(a), 0.07, outerR * Math.sin(a)),
            ];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
                color: '#8899aa',
                transparent: true,
                opacity: 0.25,
                depthTest: true,
            }));
            hepatocyteLinesGroup.add(line);
        }
        // 同心六边形辅助线
        for (let r = 1.2; r < HEX_RADIUS - 0.4; r += 1.0) {
            const ringPts = [];
            for (let i = 0; i <= 6; i++) {
                const a = (Math.PI / 3) * i - Math.PI / 6;
                ringPts.push(new THREE.Vector3(r * Math.cos(a), 0.07, r * Math.sin(a)));
            }
            const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
            const ringLine = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({
                color: '#667788',
                transparent: true,
                opacity: 0.2,
                depthTest: true,
            }));
            hepatocyteLinesGroup.add(ringLine);
        }
        scene.add(hepatocyteLinesGroup);

        // ==================== 曲线定义：肝血窦（向心）& 胆小管（离心） ====================
        const bloodCurves = []; // 肝血窦曲线：门管区→中央静脉
        const bileCurves = []; // 胆小管曲线：中央静脉附近→门管区
        const BLOOD_Y = 0.65; // 肝血窦管道高度
        const BILE_Y = 0.22; // 胆小管管道高度

        portalAngles.forEach((angle, idx) => {
            const px = HEX_RADIUS * Math.cos(angle);
            const pz = HEX_RADIUS * Math.sin(angle);
            const portalPos = new THREE.Vector3(px, 0, pz);
            const centerPos = new THREE.Vector3(0, 0, 0);
            const midDir = portalPos.clone().normalize();
            const perpDir = new THREE.Vector3(-midDir.z, 0, midDir.x).normalize();

            // 每个门管区2条肝血窦曲线（起点略微偏移）
            for (let s = -1; s <= 1; s += 2) {
                const startOffset = perpDir.clone().multiplyScalar(s * 0.35);
                const startPt = portalPos.clone().add(startOffset).setY(BLOOD_Y);
                // 终点靠近中央静脉
                const endPt = centerPos.clone().add(
                    perpDir.clone().multiplyScalar(s * 0.25)
                ).setY(BLOOD_Y);
                // 控制点：在路径中点向径向外侧偏移（创造向心弧线）
                const midPt = startPt.clone().add(endPt).multiplyScalar(0.5);
                const ctrlOffset = perpDir.clone().multiplyScalar(s * 0.9);
                const ctrlPt = midPt.clone().add(ctrlOffset).setY(BLOOD_Y);

                const curve = new THREE.QuadraticBezierCurve3(startPt.clone(), ctrlPt.clone(), endPt.clone());
                bloodCurves.push({ curve, portalIdx: idx, strand: s });
            }

            // 每个门管区2条胆小管曲线（从中央静脉附近出发到门管区）
            for (let s = -1; s <= 1; s += 2) {
                const perpDirB = new THREE.Vector3(-midDir.z, 0, midDir.x).normalize();
                // 起点靠近中央静脉
                const startPt = centerPos.clone().add(
                    perpDirB.clone().multiplyScalar(s * 0.4 + midDir.x * 0.7)
                ).setY(BILE_Y);
                // 确保起点距离中心约0.9-1.2
                const startDist = Math.sqrt(startPt.x * startPt.x + startPt.z * startPt.z);
                const startNorm = new THREE.Vector3(startPt.x, 0, startPt.z).normalize();
                const actualStart = startNorm.clone().multiplyScalar(1.05).setY(BILE_Y);
                // 终点在门管区
                const endPt = portalPos.clone().add(
                    perpDirB.clone().multiplyScalar(s * 0.3)
                ).setY(BILE_Y);
                // 控制点：向另一侧偏移（与肝血窦相反方向）
                const midPt = actualStart.clone().add(endPt).multiplyScalar(0.5);
                const ctrlOffset = perpDirB.clone().multiplyScalar(-s * 1.1);
                const ctrlPt = midPt.clone().add(ctrlOffset).setY(BILE_Y);

                const curve = new THREE.QuadraticBezierCurve3(actualStart.clone(), ctrlPt.clone(), endPt.clone());
                bileCurves.push({ curve, portalIdx: idx, strand: s });
            }
        });

        // ==================== 管道几何体（TubeGeometry） ====================
        const bloodTubeGroup = new THREE.Group();
        bloodTubeGroup.name = '肝血窦管道群';
        const bileTubeGroup = new THREE.Group();
        bileTubeGroup.name = '胆小管管道群';

        bloodCurves.forEach(({ curve }) => {
            const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.09, 8, false);
            const tubeMat = createGlowMaterial('#e07075', 0.38, 0.35);
            const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
            tubeMesh.castShadow = true;
            tubeMesh.receiveShadow = true;
            bloodTubeGroup.add(tubeMesh);
        });

        bileCurves.forEach(({ curve }) => {
            const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.07, 8, false);
            const tubeMat = createGlowMaterial('#d4a840', 0.4, 0.4);
            const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
            tubeMesh.castShadow = true;
            tubeMesh.receiveShadow = true;
            bileTubeGroup.add(tubeMesh);
        });

        scene.add(bloodTubeGroup);
        scene.add(bileTubeGroup);

        // ==================== 粒子纹理生成 ====================
        function createGlowTexture(innerColor, outerColor = 'rgba(0,0,0,0)') {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2);
            gradient.addColorStop(0, innerColor);
            gradient.addColorStop(0.35, innerColor);
            gradient.addColorStop(0.7, 'rgba(255,255,255,0.08)');
            gradient.addColorStop(1, outerColor);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return tex;
        }
        const bloodParticleTex = createGlowTexture('rgba(255,140,140,1)', 'rgba(200,60,60,0)');
        const bileParticleTex = createGlowTexture('rgba(255,210,110,1)', 'rgba(200,150,30,0)');

        // ==================== 粒子系统 ====================
        const PARTICLES_PER_BLOOD_CURVE = 7;
        const PARTICLES_PER_BILE_CURVE = 6;
        const totalBloodParticles = bloodCurves.length * PARTICLES_PER_BLOOD_CURVE;
        const totalBileParticles = bileCurves.length * PARTICLES_PER_BILE_CURVE;

        // 血液粒子数据
        const bloodParticleData = [];
        const bloodPositionsArr = new Float32Array(totalBloodParticles * 3);
        for (let i = 0; i < bloodCurves.length; i++) {
            for (let j = 0; j < PARTICLES_PER_BLOOD_CURVE; j++) {
                const t = j / PARTICLES_PER_BLOOD_CURVE + Math.random() * 0.12;
                bloodParticleData.push({
                    curveIndex: i,
                    t: Math.min(t, 0.99),
                    speed: 0.85 + Math.random() * 0.3,
                });
                const pt = bloodCurves[i].curve.getPointAt(Math.min(t, 0.99));
                const idx3 = bloodParticleData.length - 1;
                bloodPositionsArr[idx3 * 3] = pt.x;
                bloodPositionsArr[idx3 * 3 + 1] = pt.y;
                bloodPositionsArr[idx3 * 3 + 2] = pt.z;
            }
        }

        const bloodParticlesGeo = new THREE.BufferGeometry();
        bloodParticlesGeo.setAttribute('position', new THREE.BufferAttribute(bloodPositionsArr, 3));
        const bloodParticlesMat = new THREE.PointsMaterial({
            size: 0.14,
            map: bloodParticleTex,
            color: '#ff8888',
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.9,
        });
        const bloodPoints = new THREE.Points(bloodParticlesGeo, bloodParticlesMat);
        bloodPoints.name = '血液粒子（向心流动）';
        scene.add(bloodPoints);

        // 胆汁粒子数据
        const bileParticleData = [];
        const bilePositionsArr = new Float32Array(totalBileParticles * 3);
        for (let i = 0; i < bileCurves.length; i++) {
            for (let j = 0; j < PARTICLES_PER_BILE_CURVE; j++) {
                const t = j / PARTICLES_PER_BILE_CURVE + Math.random() * 0.12;
                bileParticleData.push({
                    curveIndex: i,
                    t: Math.min(t, 0.99),
                    speed: 0.8 + Math.random() * 0.35,
                });
                const pt = bileCurves[i].curve.getPointAt(Math.min(t, 0.99));
                const idx3 = bileParticleData.length - 1;
                bilePositionsArr[idx3 * 3] = pt.x;
                bilePositionsArr[idx3 * 3 + 1] = pt.y;
                bilePositionsArr[idx3 * 3 + 2] = pt.z;
            }
        }

        const bileParticlesGeo = new THREE.BufferGeometry();
        bileParticlesGeo.setAttribute('position', new THREE.BufferAttribute(bilePositionsArr, 3));
        const bileParticlesMat = new THREE.PointsMaterial({
            size: 0.12,
            map: bileParticleTex,
            color: '#ffcc55',
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.9,
        });
        const bilePoints = new THREE.Points(bileParticlesGeo, bileParticlesMat);
        bilePoints.name = '胆汁粒子（离心流动）';
        scene.add(bilePoints);

        // ==================== 装饰：门管区小标签柱 ====================
        // （已包含在portalGroups的三联征中）

        // ==================== 状态变量 ====================
        let globalSpeed = 1.0;
        let isPaused = false;
        let showBlood = true;
        let showBile = true;

        // ==================== 射线检测（悬停标注） ====================
        const raycaster = new THREE.Raycaster();
        raycaster.far = 14;
        const mouse = new THREE.Vector2();
        const allHitTargets = [cvHitSphere, ...portalHitSpheres];

        function updateTooltip(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allHitTargets, false);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData && obj.userData.label) {
                    ttName.textContent = obj.userData.label;
                    ttDesc.textContent = obj.userData.desc || '';
                    tooltip.style.display = 'block';
                    const screenX = event.clientX - container.getBoundingClientRect().left;
                    const screenY = event.clientY - container.getBoundingClientRect().top;
                    let tx = screenX + 18;
                    let ty = screenY - 50;
                    if (tx + 270 > container.clientWidth) tx = screenX - 280;
                    if (ty < 10) ty = screenY + 20;
                    tooltip.style.left = tx + 'px';
                    tooltip.style.top = ty + 'px';
                    container.style.cursor = 'pointer';
                    return;
                }
            }
            tooltip.style.display = 'none';
            container.style.cursor = '';
        }

        // 桌面端鼠标移动
        container.addEventListener('mousemove', updateTooltip, { passive: true });
        container.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            container.style.cursor = '';
        });
        // 移动端触摸（简单处理：触摸时在触摸点检测）
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                updateTooltip({ clientX: touch.clientX, clientY: touch.clientY });
            }
        }, { passive: true });
        container.addEventListener('touchend', () => {
            setTimeout(() => {
                tooltip.style.display = 'none';
                container.style.cursor = '';
            }, 1500);
        });

        // ==================== 动画循环 ====================
        const clock = new THREE.Clock();
        let animTime = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const rawDt = Math.min(clock.getDelta(), 0.15);
            const dt = isPaused ? 0 : rawDt * globalSpeed;
            animTime += dt;

            controls.update();

            // 更新血液粒子
            if (showBlood && dt > 0) {
                const posArr = bloodParticlesGeo.attributes.position.array;
                for (let i = 0; i < bloodParticleData.length; i++) {
                    const pd = bloodParticleData[i];
                    pd.t += dt * pd.speed * 0.16;
                    if (pd.t >= 1.0) pd.t -= 1.0;
                    if (pd.t < 0) pd.t += 1.0;
                    const pt = bloodCurves[pd.curveIndex].curve.getPointAt(Math.max(0, Math.min(0.999, pd.t)));
                    posArr[i * 3] = pt.x;
                    posArr[i * 3 + 1] = pt.y;
                    posArr[i * 3 + 2] = pt.z;
                }
                bloodParticlesGeo.attributes.position.needsUpdate = true;
            }
            bloodPoints.visible = showBlood;

            // 更新胆汁粒子
            if (showBile && dt > 0) {
                const posArr = bileParticlesGeo.attributes.position.array;
                for (let i = 0; i < bileParticleData.length; i++) {
                    const pd = bileParticleData[i];
                    pd.t += dt * pd.speed * 0.16;
                    if (pd.t >= 1.0) pd.t -= 1.0;
                    if (pd.t < 0) pd.t += 1.0;
                    const pt = bileCurves[pd.curveIndex].curve.getPointAt(Math.max(0, Math.min(0.999, pd.t)));
                    posArr[i * 3] = pt.x;
                    posArr[i * 3 + 1] = pt.y;
                    posArr[i * 3 + 2] = pt.z;
                }
                bileParticlesGeo.attributes.position.needsUpdate = true;
            }
            bilePoints.visible = showBile;

            // 门管区脉冲光环动画
            portalGlowRings.forEach((ringData) => {
                const s = ringData.baseScale + Math.sin(animTime * 2.5 + ringData.phase) * 0.18;
                ringData.mesh.scale.setScalar(Math.max(0.85, s));
                ringData.mesh.material.opacity = 0.45 + Math.sin(animTime * 2.5 + ringData.phase) * 0.3;
            });

            // 中央静脉微呼吸
            const cvBreath = 1 + Math.sin(animTime * 1.5) * 0.03;
            cvRing.scale.setScalar(cvBreath);
            cvRing.material.emissiveIntensity = 0.6 + Math.sin(animTime * 1.5) * 0.3;

            renderer.render(scene, camera);
        }

        // ==================== UI事件 ====================
        checkboxBlood.addEventListener('change', () => {
            showBlood = checkboxBlood.checked;
        });
        checkboxBile.addEventListener('change', () => {
            showBile = checkboxBile.checked;
        });
        speedSlider.addEventListener('input', () => {
            globalSpeed = parseFloat(speedSlider.value);
            speedVal.textContent = globalSpeed.toFixed(1) + '×';
        });
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.textContent = isPaused ? '▶️ 播放' : '⏯️ 暂停';
            btnPause.classList.toggle('active', isPaused);
        });
        btnReset.addEventListener('click', () => {
            // 平滑动画到默认视角
            const startPos = camera.position.clone();
            const endPos = defaultCameraPos.clone();
            const startTarget = controls.target.clone();
            const endTarget = defaultTarget.clone();
            const startTime = performance.now();
            const duration = 800;

            function animReset(ts) {
                const elapsed = ts - startTime;
                const t = Math.min(elapsed / duration, 1.0);
                // easeInOutCubic
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                camera.position.lerpVectors(startPos, endPos, ease);
                controls.target.lerpVectors(startTarget, endTarget, ease);
                controls.update();
                if (t < 1) {
                    requestAnimationFrame(animReset);
                }
            }
            requestAnimationFrame(animReset);
        });

        // 键盘快捷键
        window.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case ' ':
                    e.preventDefault();
                    isPaused = !isPaused;
                    btnPause.textContent = isPaused ? '▶️ 播放' : '⏯️ 暂停';
                    btnPause.classList.toggle('active', isPaused);
                    break;
                case 'r':
                    if (!e.ctrlKey && !e.metaKey) {
                        btnReset.click();
                    }
                    break;
                case '1':
                    showBlood = !showBlood;
                    checkboxBlood.checked = showBlood;
                    break;
                case '2':
                    showBile = !showBile;
                    checkboxBile.checked = showBile;
                    break;
            }
        });

        // ==================== 响应式处理 ====================
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ==================== 启动 ====================
        // 初始设置粒子可见性
        bloodPoints.visible = showBlood;
        bilePoints.visible = showBile;
        speedVal.textContent = globalSpeed.toFixed(1) + '×';

        // 开始动画
        requestAnimationFrame(animate);

        // ==================== 输出信息 ====================
        console.log('🫁 肝小叶微循环3D可视化已就绪');
        console.log('  🩸 血液（红色粒子）：向心流动 — 门管区 → 肝血窦 → 中央静脉');
        console.log('  🟡 胆汁（金色粒子）：离心流动 — 肝细胞 → 胆小管 → 小叶间胆管（门管区）');
        console.log('  🖱️ 鼠标拖拽旋转 | 滚轮缩放 | 悬停门管区/中央静脉查看标注');
        console.log('  ⌨️ 快捷键：空格=暂停 | 1=切换血液 | 2=切换胆汁 | R=重置视角');
        console.log('  📱 支持触摸拖动（移动端）');
        console.log('  共 ' + bloodCurves.length + ' 条肝血窦管道，' + bileCurves.length + ' 条胆小管管道');
        console.log('  血液粒子：' + totalBloodParticles + ' 个 | 胆汁粒子：' + totalBileParticles + ' 个');
    </script>
</body>
</html>
