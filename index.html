<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎首页</title>
    <style>
        /* 页面基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 页面背景与居中 */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 欢迎文字样式 */
        .welcome-text {
            font-size: 42px;
            font-weight: 500;
            color: #2c3e50;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }

        /* 淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 小屏幕适配 */
        @media (max-width: 768px) {
            .welcome-text {
                font-size: 28px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <h1 class="welcome-text">宋先生，您好，欢迎光临</h1>
</body>
</html>
